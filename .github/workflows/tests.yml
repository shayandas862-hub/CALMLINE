name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (integration excluded — no live Supabase in CI)
        run: pytest -q -m "not integration"

      - name: Content check
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
        run: python scripts/check_banned_words.py
