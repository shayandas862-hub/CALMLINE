[project]
name = "calmline"
version = "0.1.0"
description = "A governed insurance-triage AI agent with eval-gated releases."
# Matches LICENSE. Without this line the package metadata reads "no licence",
# which defaults to all-rights-reserved and contradicts the file beside it.
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "supabase>=2.0",
    "anthropic>=0.69",
    "pydantic-settings>=2.6",
    "openai>=1.40,<3",
    "cohere>=5.0,<8",
    "asyncpg>=0.29,<1",
    "tiktoken>=0.7,<1",
    "langchain-text-splitters>=0.3,<1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests are OPT-IN: `pytest -m integration`.
# Deselecting them by default is what keeps "zero live API calls in the test
# suite" true once a developer has a real .env — before this, the only gate was
# a missing credential, so provisioning one silently turned every local
# `pytest -q` into a live-calling run against Supabase and OpenAI.
addopts = '-m "not integration"'
markers = [
    "integration: talks to live external services (Supabase/OpenAI); opt-in only",
]
